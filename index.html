<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#fafaf9">
<title>Поиграем?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Space+Mono:wght@400;700&display=swap">
<style>
  /* Intent: tense heads-up game at a light tournament table. Tokens and rules: DESIGN.md */
  :root{
    color-scheme:light;
    --paper:#f3f3f0; --card:#fcfcfa; --sunk:#e9e9e5; --line:#d6d4cc;
    --ink:#111110; --muted:#575650; --faint:#66655e;
    --accent:#ff5a1f; --accent-text:#b23a00; --ok:#1d6b3f; --no:#a8321b;
    --r-box:14px; --r-ctl:10px; --ease:cubic-bezier(.16,1,.3,1);
    --mono:"Geist Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 Geist,system-ui,sans-serif;-webkit-font-smoothing:antialiased;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  main{max-width:560px;margin:0 auto;padding:max(24px,env(safe-area-inset-top)) 18px max(64px,env(safe-area-inset-bottom))}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .skip{position:absolute;left:-9999px}
  .skip:focus{left:12px;top:12px;background:var(--card);padding:8px 12px;border-radius:var(--r-ctl);z-index:10}

  header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:22px}
  .round-tag{font:600 13px var(--mono);letter-spacing:.08em;color:var(--muted);margin-left:auto}

  h1{font-size:clamp(36px,10vw,52px);font-weight:800;letter-spacing:-.045em;line-height:1.02;margin:0 0 12px;text-wrap:balance}
  h2{font-size:22px;font-weight:700;letter-spacing:-.025em;line-height:1.2;margin:0 0 6px;text-wrap:balance}
  .hint{color:var(--muted);font-size:15px;margin:0;max-width:58ch;text-wrap:pretty}
  section{padding:24px 0;border-top:1px solid var(--line)}
  .lead{padding-top:0;border-top:0}

  /* scoreboard */
  .board{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:10px;margin:0 0 18px}
  .board .who{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .board .num{font:600 56px/1 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.06em}
  .board .me .num{color:var(--accent-text)}
  .board .them{text-align:right}
  .board .mid{padding-bottom:12px;color:var(--faint);font:500 13px var(--mono)}
  .balance{position:relative;height:1px;background:var(--line);margin:0 0 26px}
  .balance i{position:absolute;top:-5px;width:11px;height:11px;border-radius:50%;background:var(--accent);transform:translateX(-50%);transition:left .6s var(--ease)}

  /* table */
  .table{background:var(--card);border:1px solid var(--line);border-radius:var(--r-box);padding:20px 18px;margin:0 0 22px;box-shadow:0 1px 0 rgb(17 17 16 / .04),0 16px 36px -22px rgb(17 17 16 / .28)}
  .lot{display:flex;justify-content:space-between;gap:12px;align-items:center;border:1px dashed var(--accent);border-radius:var(--r-ctl);padding:10px 12px;margin:0 0 18px;font-size:14px}
  .lot b{font-weight:600}
  .lot .x{font:600 14px var(--mono);color:var(--accent-text);white-space:nowrap}
  .q{font-size:25px;font-weight:700;letter-spacing:-.025em;line-height:1.22;margin:0 0 4px;text-wrap:balance}
  .sub{font-size:14px;color:var(--muted);margin:0 0 16px}

  .options{display:grid;gap:8px}
  .opt{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;width:100%;text-align:left;background:var(--sunk);border:1.5px solid transparent;border-radius:var(--r-ctl);padding:13px 14px;font:inherit;color:var(--ink);cursor:pointer;transition:border-color .15s var(--ease),background-color .15s var(--ease),transform .12s var(--ease)}
  .opt:hover{border-color:var(--line)}
  .opt:active{transform:scale(.99)}
  .opt:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .opt[aria-checked="true"]{background:var(--card);border-color:var(--ink)}
  .opt .k{font:600 14px var(--mono);color:var(--faint);padding-top:1px}
  .opt[aria-checked="true"] .k{color:var(--accent-text)}
  .opt .t{overflow-wrap:anywhere}

  .stake{margin-top:20px}
  .stake .lbl{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:var(--muted)}
  .stepper{display:grid;grid-template-columns:56px 1fr 56px;align-items:center;gap:8px;margin-top:8px}
  .stepper button{height:56px;border-radius:var(--r-ctl);border:1px solid var(--line);background:var(--card);font:600 24px var(--mono);color:var(--ink);cursor:pointer;transition:background-color .15s var(--ease),transform .12s var(--ease)}
  .stepper button:hover{background:var(--sunk)}
  .stepper button:active{transform:scale(.96)}
  .stepper button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .stepper button[disabled]{opacity:.35;cursor:not-allowed}
  .stepper output{text-align:center;font:600 46px/1 var(--mono);font-variant-numeric:tabular-nums;color:var(--accent-text)}
  .quick{display:flex;gap:8px;margin-top:10px}
  .chipbtn{flex:1;min-height:40px;border-radius:999px;border:1px solid var(--line);background:transparent;font:600 13px var(--mono);color:var(--ink);cursor:pointer;transition:background-color .15s var(--ease)}
  .chipbtn:hover{background:var(--sunk)}
  .chipbtn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .chipbtn[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
  .payout{font-size:14px;color:var(--muted);margin-top:12px;font-variant-numeric:tabular-nums}
  .payout b{color:var(--ink);font-weight:600}

  .btn{display:inline-flex;align-items:center;justify-content:center;width:100%;min-height:54px;border:1px solid transparent;border-radius:var(--r-ctl);padding:0 18px;font:700 16px Geist,sans-serif;letter-spacing:-.01em;cursor:pointer;background:var(--ink);color:var(--card);margin-top:18px;white-space:nowrap;transition:transform .12s var(--ease),background-color .15s var(--ease)}
  .btn:hover{background:#2a2a28}
  .btn:active{transform:scale(.98)}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .btn[disabled]{opacity:.5;cursor:progress}
  .btn.hot{background:var(--accent);color:var(--ink)}
  .btn.hot:hover{background:#ff6d38}
  .btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
  .btn.ghost:hover{background:var(--sunk)}
  .row{display:grid;grid-template-columns:1fr 2fr;gap:8px}
  .row .btn{margin-top:12px}

  .status{display:flex;align-items:center;gap:10px;color:var(--muted);margin-top:16px;font-size:15px}
  .pulse{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
  .err{color:var(--no);font-size:14px;margin:12px 0 0}
  .note{font-size:14px;color:var(--muted);margin:14px 0 0}

  /* reveal */
  .sealed{display:grid;place-items:center;text-align:center;padding:26px 6px 6px}
  .sealed .big{font:600 64px/1 var(--mono);color:var(--accent-text);letter-spacing:-.06em}
  .result{display:grid;gap:12px;margin-top:4px}
  .res-h{font-size:14px;color:var(--muted);margin:16px 0 8px}
  .card-r{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start;padding:12px 14px;border-radius:var(--r-ctl);background:var(--sunk);border:1.5px solid transparent;margin-bottom:6px}
  .card-r .t{overflow-wrap:anywhere}
  .card-r.truth{background:var(--card);border-color:var(--ink)}
  .card-r .m{font:600 12px var(--mono);color:var(--muted);white-space:nowrap;padding-top:3px}
  .card-r.truth .m{color:var(--ink)}
  .delta{display:inline-flex;font:600 15px var(--mono);padding:4px 10px;border-radius:999px;font-variant-numeric:tabular-nums}
  .delta.ok{color:var(--ok);background:#e2eee6}
  .delta.no{color:var(--no);background:#f3e4e0}
  .delta.zero{color:var(--muted);background:var(--sunk)}
  .verdict{font-size:34px;font-weight:800;letter-spacing:-.04em;line-height:1.05;margin:4px 0 8px}

  /* secrets */
  .secret{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px}
  .piece{min-height:92px;padding:12px;border-radius:var(--r-ctl);border:1px dashed var(--line);display:flex;flex-direction:column;justify-content:space-between;gap:8px;perspective:600px}
  .piece .n{font:600 12px var(--mono);color:var(--faint)}
  .piece .v{overflow-wrap:anywhere;white-space:pre-wrap;font-size:15px}
  .piece.closed .v{color:var(--faint)}
  .piece.open{border:1px solid var(--ink);background:var(--card)}
  .piece.open .n{color:var(--accent-text)}
  .piece.full{grid-column:1/-1}
  .meter{display:flex;gap:4px;margin-top:10px}
  .meter i{flex:1;height:6px;border-radius:999px;border:1px solid var(--line)}
  .meter i.on{background:var(--ink);border-color:var(--ink)}

  /* setup */
  .field{display:grid;gap:7px;margin-top:16px}
  .field label,.flbl{font-size:15px;font-weight:600}
  .field .help{font-size:13px;color:var(--muted);margin-top:-3px}
  input[type=text],textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--r-ctl);color:var(--ink);padding:12px 13px;font:inherit;transition:border-color .15s var(--ease),box-shadow .15s var(--ease)}
  input::placeholder,textarea::placeholder{color:var(--faint)}
  textarea{min-height:52px;resize:vertical}
  input:focus-visible,textarea:focus-visible{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgb(255 90 31 / .25)}
  .field.bad input,.field.bad textarea{border-color:var(--no)}
  .qblock{padding:18px 0 4px;border-top:1px solid var(--line);margin-top:18px}
  .qblock:first-of-type{border-top:0;margin-top:6px}
  .qnum{font:600 13px var(--mono);color:var(--accent-text)}
  .qtitle{font-size:18px;font-weight:700;letter-spacing:-.02em;margin:2px 0 0}
  .true-lbl{color:var(--ink)}
  .decoy-lbl{color:var(--muted)}

  details{border-top:1px solid var(--line);padding:18px 0}
  details summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between}
  details summary::-webkit-details-marker{display:none}
  details summary::after{content:"+";font:600 20px var(--mono);color:var(--muted);transition:transform .2s var(--ease)}
  details[open] summary::after{transform:rotate(45deg)}
  details summary:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
  details ol{margin:12px 0 0;padding-left:20px;color:var(--muted);display:grid;gap:8px}

  .skeleton{display:grid;gap:12px}
  .skeleton i{display:block;height:16px;border-radius:8px;background:var(--sunk)}
  .skeleton i:nth-child(1){width:40%;height:52px}

  @media (prefers-reduced-motion: no-preference){
    .enter{animation:enter .45s var(--ease) both}
    .flip{animation:flip .6s var(--ease) both}
    .flip:nth-child(2){animation-delay:.12s}.flip:nth-child(3){animation-delay:.24s}
    .piece.fresh{animation:flip .7s var(--ease) both}
    .pulse,.skeleton i{animation:pulse 1.6s ease-in-out infinite}
  }
  @keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes flip{from{opacity:0;transform:rotateX(-70deg)}to{opacity:1;transform:none}}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}

  /* ===== B/W playful layer. Intent: minimal black and white, playful like stickers on a game table. ===== */
  :root{
    --paper:#fafaf9; --card:#ffffff; --sunk:#f0f0ee; --line:#0b0b0b;
    --ink:#0b0b0b; --muted:#4a4a48; --faint:#5e5e5b;
    --accent:#0b0b0b; --accent-text:#0b0b0b; --ok:#0b0b0b; --no:#0b0b0b;
    --r-box:18px; --r-ctl:14px;
    --mono:"Space Mono",ui-monospace,monospace;
    --pop:cubic-bezier(.34,1.56,.64,1);
    --shadow:4px 4px 0 var(--ink);
  }
  body{font-family:"Bricolage Grotesque",system-ui,sans-serif}
  h1{font-weight:800;letter-spacing:-.05em;font-size:clamp(42px,12vw,64px);line-height:.95}
  h2{font-weight:800;letter-spacing:-.035em}
  .q{font-weight:800;letter-spacing:-.03em;font-size:28px;line-height:1.1}
  section{border-top:2px solid var(--ink)}
  .lead{border-top:0}
  details{border-top:2px solid var(--ink)}

  .table{border:2px solid var(--ink);box-shadow:6px 6px 0 var(--ink);transform:rotate(-.6deg)}
  .lot{border:2px dashed var(--ink);font-weight:600}
  .lot .x{background:var(--ink);color:var(--paper);padding:2px 8px;border-radius:999px;transform:rotate(3deg)}

  .board .num{font:700 60px/1 var(--mono);letter-spacing:-.06em}
  .board .me .num{color:var(--ink)}
  .board .them .num{color:transparent;-webkit-text-stroke:2px var(--ink)}
  .balance{height:2px;background:var(--ink)}
  .balance i{width:16px;height:16px;top:-7px;border:2px solid var(--ink);background:var(--paper)}

  .opt{background:var(--card);border:2px solid var(--ink);box-shadow:var(--shadow);transition:transform .25s var(--pop),box-shadow .2s var(--ease),background-color .15s,color .15s}
  .opt:nth-child(1){transform:rotate(-.8deg)} .opt:nth-child(2){transform:rotate(.6deg)} .opt:nth-child(3){transform:rotate(-.4deg)}
  .opt:hover{transform:rotate(0) translate(-1px,-1px);box-shadow:6px 6px 0 var(--ink)}
  .opt:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
  .opt[aria-checked="true"]{background:var(--ink);color:var(--paper);transform:rotate(0) scale(1.02);border-color:var(--ink);box-shadow:4px 4px 0 var(--paper),4px 4px 0 2px var(--ink)}
  .opt[aria-checked="true"] .k{color:var(--paper)}
  .opt .k{font:700 15px var(--mono);color:var(--ink)}

  .btn{border:2px solid var(--ink);box-shadow:var(--shadow);font:800 17px "Bricolage Grotesque",sans-serif;transition:transform .2s var(--pop),box-shadow .15s var(--ease)}
  .btn:hover{background:var(--ink);transform:translate(-1px,-1px);box-shadow:6px 6px 0 var(--ink)}
  .btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
  .btn.hot{background:var(--ink);color:var(--paper);box-shadow:4px 4px 0 var(--paper),4px 4px 0 2px var(--ink)}
  .btn.hot:hover{box-shadow:6px 6px 0 var(--paper),6px 6px 0 2px var(--ink)}
  .btn.hot:active{box-shadow:1px 1px 0 var(--paper),1px 1px 0 2px var(--ink)}
  .btn.hot:hover{background:var(--ink)}
  .btn.ghost{background:var(--card);color:var(--ink);border-color:var(--ink)}
  .btn.ghost:hover{background:var(--card)}
  .btn:focus-visible,.opt:focus-visible,.chipbtn:focus-visible,.stepper button:focus-visible{outline:3px solid var(--ink);outline-offset:4px}

  .stepper button{border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);font:700 26px var(--mono);transition:transform .2s var(--pop),box-shadow .15s}
  .stepper button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
  .stepper output{font:700 54px/1 var(--mono);color:var(--ink)}
  .stepper output.bump{animation:bump .35s var(--pop)}
  .chipbtn{border:2px solid var(--ink);font:700 13px var(--mono)}
  .chipbtn[aria-pressed="true"]{transform:rotate(-2deg)}

  .card-r{background:var(--card);border:2px dashed var(--ink)}
  .card-r.truth{border-style:solid;background:var(--ink);color:var(--paper)}
  .card-r.truth .m,.card-r.truth .t span{color:var(--paper)!important}
  .delta{border:2px solid var(--ink);font:700 15px var(--mono)}
  .delta.ok{background:var(--ink);color:var(--paper)}
  .delta.no{background:var(--card);color:var(--ink);text-decoration:line-through}
  .delta.zero{background:var(--card);color:var(--ink)}
  .sealed .big{font:700 72px/1 var(--mono);color:var(--ink);display:inline-block}
  .verdict{font-weight:800;font-size:40px;letter-spacing:-.05em}

  .piece{border:2px dashed var(--ink)}
  .piece:nth-child(odd){transform:rotate(-.7deg)} .piece:nth-child(even){transform:rotate(.7deg)}
  .piece.open{border:2px solid var(--ink);background:var(--ink);color:var(--paper);box-shadow:var(--shadow)}
  .piece.open .n{color:var(--paper)}
  .piece.closed .v{font-family:var(--mono);letter-spacing:.2em}
  .meter i{border:2px solid var(--ink);height:10px}
  .meter i.on{background:var(--ink)}
  .pulse{background:var(--ink)}

  input[type=text],textarea{border:2px solid var(--ink);border-radius:var(--r-ctl);background:var(--card)}
  input:focus-visible,textarea:focus-visible{box-shadow:var(--shadow);border-color:var(--ink)}
  .field.bad input,.field.bad textarea{border-style:dashed}
  .err{color:var(--ink);font-weight:700}
  .err::before{content:"! ";font-family:var(--mono)}
  .qblock{border-top:2px dashed var(--ink)}
  .qnum{display:inline-block;background:var(--ink);color:var(--paper);font:700 12px var(--mono);padding:2px 8px;border-radius:999px;transform:rotate(-2deg)}
  .round-tag{font:700 13px var(--mono);color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:2px 10px}
  .round-tag:empty{display:none}
  .board>div{min-width:0}
  h1,h2,.q,.hint,.lot span,.note,.status,.res-h,.payout{overflow-wrap:anywhere}
  .skeleton i{background:var(--sunk);border:2px solid var(--sunk)}

  @media (prefers-reduced-motion: no-preference){
    .enter{animation:pop .5s var(--pop) both}
    .flip{animation:cardflip .55s var(--pop) both}
    .piece.fresh{animation:cardflip .7s var(--pop) both}
    .sealed .big{animation:wobble 2.4s ease-in-out infinite}
  }
  @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1}}
  @keyframes cardflip{from{opacity:0;transform:rotateY(90deg)}to{opacity:1;transform:none}}
  @keyframes wobble{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
  @keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
  @media (prefers-reduced-motion: reduce){
    .table,.opt,.piece,.lot .x,.qnum,.chipbtn[aria-pressed="true"]{transform:none!important}
    .stepper output.bump{animation:none}
  }
</style>
</head>
<body>
<a class="skip" href="#app">К игре</a>
<main>
  <header><div class="round-tag" id="rtag"></div></header>
  <div id="app" aria-live="polite"></div>
</main>
<script type="module">
/* Rules (see report): 5 rounds of rising depth. Each player writes the true answer and two decoys.
   The guesser picks one of three and bets. Hit: +2x stake (final round +3x) and one piece of the secret.
   Miss: the stake goes to the bluffer. Being guessed right pays the answerer +1, so honest-but-guessable answers are rewarded. One pass per game. Fewer chips at the end reveals everything. */
/* Supabase project. The anon key is public by design; Row Level Security protects the data. */
const SUPABASE_URL = "https://aesdxefgousmzgxzuqni.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFlc2R4ZWZnb3VzbXpneHp1cW5pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM2MjU5NjMsImV4cCI6MjA5OTIwMTk2M30.zqL6JwkopA_GAW2OkaSvzIGwXptJBcnR-wsASyO5Od4";

/* Each game lives at its own private link: site/#g-<random id>. */
const GID = (location.hash.match(/^#g-([a-z0-9]{12,})$/) || [])[1] || "";
let seatRef = null;

/* The true-answer positions and the secret never leave this phone until they are won. */
function loadVault() { try { const v = JSON.parse(localStorage.getItem("ssz-vault-" + GID) || "null"); return v && Array.isArray(v.truthIdx) ? v : null; } catch (e) { return null; } }
function saveVault(v) { try { localStorage.setItem("ssz-vault-" + GID, JSON.stringify(v)); } catch (e) {} vault = v; }

/* Load the Supabase client from the first CDN that answers. */
async function loadSupabase() {
  const esm = ["https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm", "https://esm.sh/@supabase/supabase-js@2.45.4", "https://unpkg.com/@supabase/supabase-js@2.45.4/dist/module/index.js"];
  for (const url of esm) { try { const m = await import(url); if (m.createClient) return m.createClient; } catch (e) { console.warn("CDN failed", url); } }
  await new Promise((ok, bad) => { const sc = document.createElement("script"); sc.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"; sc.onload = ok; sc.onerror = bad; document.head.appendChild(sc); });
  if (window.supabase && window.supabase.createClient) return window.supabase.createClient;
  throw new Error("Supabase client unavailable");
}

function newGameId() { const a = new Uint8Array(12); crypto.getRandomValues(a); return Array.from(a, b => "abcdefghijkmnpqrstuvwxyz23456789"[b % 32]).join(""); }
function inviteLink() { return location.origin + location.pathname + "#g-" + GID; }

function renderLanding() {
  document.getElementById("app").innerHTML = `
  <section class="lead enter">
    <h1>Поиграем?</h1>

    <button class="btn hot" type="button" id="create">Создать игру</button>
    <p class="note">Ты получишь приватную ссылку. Отправь её одному человеку.</p>

  document.getElementById("create").addEventListener("click", () => { location.hash = "g-" + newGameId(); location.reload(); });
}
window.addEventListener("hashchange", () => location.reload());

const QUESTIONS = [
  "Твоя самая странная привычка?",
  ["Самое безумное, что ты делал ради кого-то?", "Самое безумное, что ты делала ради кого-то?"],
  "Что цепляет тебя в человеке с первой секунды?",
  ["Что ты подумал, когда впервые меня увидел?", "Что ты подумала, когда впервые меня увидела?"],
  ["Что бы ты сделал, если бы точно никто не узнал?", "Что бы ты сделала, если бы точно никто не узнал?"]
];
/* Questions can depend on the answerer's gender: [masculine, feminine]. */
const gf = (p, m, f) => p && p.g === "f" ? f : m;
const qText = (i, p) => { const q = QUESTIONS[i]; return Array.isArray(q) ? gf(p, q[0], q[1]) : q; };
const LAYERS = ["Одно слово", "О чём это", "Половина", "Целиком"];
const LAYER_HINTS = ["Одно слово-намёк…", "Тема, место или настроение…", "Начало истории…", "Всё целиком…"];
const START = 10, ROUNDS = QUESTIONS.length, NL = LAYERS.length, LETTERS = ["A", "B", "C"];
const isFinal = i => i === ROUNDS - 1;
const mult = i => isFinal(i) ? 3 : 2;
const maxBet = (i, chips) => Math.max(1, Math.min(isFinal(i) ? 10 : 5, chips));

let db = null, user = null, me = null;
let docs = {}, vault = null, vaultLoaded = false, loaded = false, err = "", formErr = "", errField = "";
let writing = false, lastSig = "", lastScreen = "";
const seenPieces = { opp: -1 };
const view = { confirmSurrender: false, busy: "", pick: {}, bet: {}, reveal: null, opened: loadOpened() };
const drafts = {};

function loadOpened() { try { return JSON.parse(localStorage.getItem("ssz-opened-" + GID) || "[]"); } catch (e) { return []; } }
function saveOpened() { try { localStorage.setItem("ssz-opened-" + GID, JSON.stringify(view.opened)); } catch (e) {} }

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const sign = n => (n > 0 ? "+" : n < 0 ? "-" : "") + Math.abs(n);

function oppId() {
  const ids = Object.keys(docs).filter(id => id !== me).sort((a, b) => (docs[a].joinedAt || 0) - (docs[b].joinedAt || 0));
  return ids[0] || null;
}
function opp() { const id = oppId(); return id ? docs[id] : null; }

/* Scoring is derived from the shared state every time, so both screens always agree. */
function calc() {
  const m = docs[me], o = opp();
  let mc = START, oc = START, mHits = 0, oHits = 0, round = ROUNDS;
  const rounds = [];
  for (let i = 0; i < ROUNDS; i++) {
    const mp = m && m.picks && m.picks[i], op = o && o.picks && o.picks[i];
    const mt = m && m.truth ? m.truth[i] : undefined, ot = o && o.truth ? o.truth[i] : undefined;
    const done = !!(mp && op && mt != null && ot != null);
    let md = 0, od = 0;
    if (done) {
      if (!mp.pass) { if (mp.idx === ot) { md += mult(i) * mp.bet; od += 1; mHits++; } else { md -= mp.bet; od += mp.bet; } }
      if (!op.pass) { if (op.idx === mt) { od += mult(i) * op.bet; md += 1; oHits++; } else { od -= op.bet; md += op.bet; } }
      mc += md; oc += od;
    }
    rounds.push({ i, mp, op, mt, ot, done, md, od, mc, oc });
    if (round === ROUNDS && !done) round = i;
  }
  const passUsed = p => !!(p && p.picks && Object.values(p.picks).some(x => x && x.pass));
  return { m, o, mc, oc, mHits, oHits, round, finished: round === ROUNDS, rounds, myPassUsed: passUsed(m) };
}

function owed(c) {
  if (c.m && c.m.surrendered) return NL;
  if (c.finished && c.mc <= c.oc) return NL;
  return Math.min(NL, c.oHits);
}

async function sync() {
  if (writing || !vault || !docs[me] || !opp()) return;
  const c = calc(), m = c.m, upd = {}, truth = {};
  c.rounds.forEach(r => { if (r.mp && r.op && r.mt == null) truth[r.i] = vault.truthIdx[r.i]; });
  if (Object.keys(truth).length) upd.truth = truth;
  const need = owed(c);
  if ((m.pieces || []).length < need) upd.pieces = vault.layers.slice(0, need);
  if (!Object.keys(upd).length) return;
  writing = true;
  try {
    await seatRef().update(upd);
    docs = { ...docs, [me]: merge(JSON.parse(JSON.stringify(docs[me])), upd) };
  } catch (e) { console.warn(e); writing = false; return; }
  writing = false;
  setTimeout(tick, 0);
}

function merge(a, b) {
  for (const k in b) { if (b[k] && typeof b[k] === "object" && !Array.isArray(b[k])) { a[k] = merge(a[k] && typeof a[k] === "object" ? a[k] : {}, b[k]); } else a[k] = b[k]; }
  return a;
}

function tick() {
  sync();
  const sig = JSON.stringify([docs, vaultLoaded, !!vault, loaded, err, formErr, view]);
  if (sig !== lastSig) { lastSig = sig; render(); }
}

function render() {
  const app = document.getElementById("app");
  const a = document.activeElement, k = a && a.dataset ? a.dataset.k : null;
  const sel = k && a.selectionStart != null ? [a.selectionStart, a.selectionEnd] : null;
  const keepFocus = a && a.id && a.id.startsWith("ctl-") ? a.id : null;
  app.innerHTML = screen();
  if (errField) {
    const el = app.querySelector(`[data-k="${errField}"]`);
    if (el) el.focus();
    errField = "";
  } else if (k) {
    const el = app.querySelector(`[data-k="${k}"]`);
    if (el) { el.focus({ preventScroll: true }); if (sel && el.setSelectionRange) try { el.setSelectionRange(sel[0], sel[1]); } catch (e) {} }
  } else if (keepFocus) {
    const el = document.getElementById(keepFocus);
    if (el) el.focus({ preventScroll: true });
  }
}

function field(k, label, o = {}) {
  const id = "f-" + k, bad = errField === k;
  const help = o.help ? `<div class="help" id="${id}-h">${esc(o.help)}</div>` : "";
  const common = `id="${id}" name="${k}" data-k="${k}" autocomplete="off"${o.help ? ` aria-describedby="${id}-h"` : ""}${bad ? ' aria-invalid="true"' : ""}`;
  const ctl = o.input
    ? `<input type="text" ${common} maxlength="${o.max || 40}" value="${esc(drafts[k] || "")}" placeholder="${esc(o.ph || "")}">`
    : `<textarea ${common} rows="${o.rows || 1}" maxlength="${o.max || 400}" placeholder="${esc(o.ph || "")}">${esc(drafts[k] || "")}</textarea>`;
  return `<div class="field${bad ? " bad" : ""}"><label for="${id}" class="${o.cls || ""}">${esc(label)}</label>${help}${ctl}</div>`;
}

function rules() {
  return `<details><summary>Правила</summary><ol>
    <li>5 раундов, вопросы с каждым разом смелее. У каждого на старте ${START} фишек.</li>
    <li>На свой вопрос ты пишешь правду и два ложных ответа. Второй игрок видит все три вперемешку.</li>
    <li>Второй игрок выбирает вариант и ставит фишки. Верный выбор: плюс двойная ставка и кусочек твоего секрета, а ты получаешь 1 фишку, потому что тебя поняли. Промах: ставка уходит тебе.</li>
    <li>Ходы закрыты, пока оба не поставят. Потом раунд вскрывается одновременно.</li>
    <li>Финальный раунд ва-банк: ставка до 10 и выигрыш тройной.</li>
    <li>Один пас за игру: пропусти раунд без ставки.</li>
    <li>В конце у кого меньше фишек, тот открывает секрет целиком. Ничья: открываются оба. Сдаться можно в любой момент.</li>
  </ol></details>`;
}

function screen() {
  document.getElementById("rtag").textContent = "";
  if (err) return `<section class="lead enter"><h1>Стол закрыт</h1><p class="hint">${esc(err)}</p></section>`;
  if (!loaded || !vaultLoaded) return `<div aria-busy="true"><div class="skeleton"><i></i><i></i><i></i></div><span class="sr">Загрузка…</span></div>`;
  const m = docs[me], others = Object.keys(docs).filter(id => id !== me);
  if (!m) {
    if (others.length >= 2) return `<section class="lead"><h1>Стол занят</h1><p class="hint">Здесь уже играют двое.</p></section>`;
    return setup();
  }
  if (!vault) return `<section class="lead"><h1>Тайник не найден</h1><p class="hint">Твои карты хранятся только на устройстве, с которого ты ${gf(m, "сел", "села")} за стол. Открой ссылку там, в том же браузере.</p></section>`;
  if (!opp()) return waiting();
  return game();
}

function setup() {
  const o = opp();
  const blocks = QUESTIONS.map((_, i) => `
    <div class="qblock">
      <div class="qnum">${isFinal(i) ? "Ва-банк" : `Раунд ${i + 1}`}</div>
      <div class="qtitle">${esc(qText(i, { g: drafts.g }))}</div>
      ${field(`t${i}`, "Правда", { cls: "true-lbl", ph: "Твой честный ответ…" })}
      ${field(`d${i}a`, "Ложный ответ", { cls: "decoy-lbl", ph: "Правдоподобная ложь…" })}
      ${field(`d${i}b`, "Ещё один ложный", { cls: "decoy-lbl", ph: "И ещё одна…" })}
    </div>`).join("");
  const ls = LAYERS.map((l, i) => field("l" + i, `${i + 1}. ${l}`, { ph: LAYER_HINTS[i], rows: i === 3 ? 5 : 1, max: 2000 })).join("");
  return `
  <section class="lead enter">
    <h1>Поиграем?</h1>
    <p class="hint">${o ? `${esc(o.name)} уже за столом и ждёт тебя.` : "Угадывай ответы, ставь фишки и выигрывай кусочки чужого секрета."}</p>
  </section>
  <form id="setup" novalidate>

        <button type="button" class="chipbtn" role="radio" id="ctl-gm" data-act="gender" data-v="m" aria-checked="${drafts.g === "m"}" aria-pressed="${drafts.g === "m"}">Он</button>
        <button type="button" class="chipbtn" role="radio" id="ctl-gf" data-act="gender" data-v="f" aria-checked="${drafts.g === "f"}" aria-pressed="${drafts.g === "f"}">Она</button>
      </div></div>
      ${field("label", "Что ты прячешь", { input: true, max: 30, ph: "Например: сон или стих…", help: "Второй игрок видит это с первого раунда. Содержание закрыто." })}
    </section>
    <section>
      <h2>Твои карты</h2>
      <p class="hint">Пиши ложь, в которую поверит второй игрок. Каждый промах приносит тебе ставку.</p>
      ${blocks}
    </section>
    <section>
      <h2>Твой секрет на кону</h2>
      <p class="hint">Каждое попадание второго игрока открывает следующий кусочек.</p>

      <button class="btn hot" type="submit" ${view.busy === "join" ? "disabled" : ""}>${view.busy === "join" ? "Раздаю…" : "Сесть за стол"}</button>

function waiting() {
  const m = docs[me];
  return `
  <section class="lead enter">
    <h1>Ставки сделаны, ${esc(m.name)}</h1>
    <p class="hint">Отправь второму игроку эту ссылку. Игра начнётся, когда вы оба будете за столом.</p>
    <div class="lot" style="margin-top:16px"><span style="overflow-wrap:anywhere">${esc(inviteLink())}</span></div>
    <button class="btn hot" type="button" data-act="copy">Скопировать ссылку</button>
    <div class="status" role="status"><span class="pulse" aria-hidden="true"></span>Ждём соперника…</div>
  </section>
  ${rules()}`;
}

function board(c) {
  const total = Math.max(1, Math.abs(c.mc) + Math.abs(c.oc));
  const pos = Math.min(92, Math.max(8, 50 + ((c.mc - c.oc) / total) * 42));
  return `
  <div class="board" role="group" aria-label="Фишки: ты ${c.mc}, ${esc(c.o.name)} ${c.oc}">
    <div class="me"><div class="who">${esc(c.m.name)} (ты)</div><div class="num">${c.mc}</div></div>
    <div class="mid" aria-hidden="true">фишки</div>
    <div class="them"><div class="who">${esc(c.o.name)}</div><div class="num">${c.oc}</div></div>
  </div>
  <div class="balance" aria-hidden="true"><i style="left:${100 - pos}%"></i></div>`;
}

function game() {
  const c = calc(), m = c.m, o = c.o;
  const pending = c.rounds.find(r => r.done && !view.opened.includes(r.i));
  const rtag = document.getElementById("rtag");
  rtag.textContent = c.finished && !pending ? "Финал" : `Раунд ${(pending ? pending.i : c.round) + 1}/${ROUNDS}`;

  /* While a round is sealed, show the score and pieces from before it, so nothing spoils the reveal. */
  const sealed = pending && view.reveal !== pending.i ? pending.i : -1;
  const prev = sealed > 0 ? c.rounds[sealed - 1] : { mc: START, oc: START };
  const before = sealed >= 0 ? c.rounds.slice(0, sealed) : null;
  const shown = (pieces, p, hit) => before && !p.surrendered ? pieces.slice(0, Math.min(NL, before.filter(hit).length)) : pieces;

  let out = board(sealed >= 0 ? { ...c, mc: prev.mc, oc: prev.oc } : c);
  if (pending) out += revealHtml(c, pending);
  else if (c.finished) out += finishedHtml(c);
  else out += roundHtml(c);

  const oPieces = shown(o.pieces || [], o, r => r.done && !r.mp.pass && r.mp.idx === r.ot);
  out += `<section>
    <h2>${esc(cap(o.label || "секрет"))}: ${esc(o.name)}</h2>
    <p class="hint">Выиграно ${oPieces.length} из ${NL}</p>
    ${secretHtml(oPieces)}
  </section>`;

  const mPieces = shown(m.pieces || [], m, r => r.done && !r.op.pass && r.op.idx === r.mt).length;
  let mine = `<section><h2>Твой секрет: ${esc(m.label || "секрет")}</h2><p class="hint">${esc(o.name)} ${gf(o, "выиграл", "выиграла")} ${mPieces} из ${NL}</p>
    <div class="meter" role="img" aria-label="Открыто ${mPieces} из ${NL}">${LAYERS.map((_, i) => `<i class="${i < mPieces ? "on" : ""}"></i>`).join("")}</div>`;
  if (!m.surrendered && mPieces < NL && !c.finished) {
    mine += view.confirmSurrender
      ? `<p class="note" role="alert">${esc(o.name)} сразу увидит секрет целиком. Отменить нельзя.</p>
         <div class="row"><button class="btn ghost" type="button" data-act="noSurrender">Отмена</button><button class="btn" type="button" data-act="surrender">Открыть всё</button></div>`
      : `<button class="btn ghost" type="button" data-act="askSurrender">Сдаться и открыть секрет</button>`;
  }
  return out + mine + `</section>` + rules();
}

function secretHtml(pieces) {
  const prev = seenPieces.opp < 0 ? pieces.length : seenPieces.opp;
  seenPieces.opp = pieces.length;
  return `<div class="secret">${LAYERS.map((l, i) => {
    const open = i < pieces.length, fresh = open && i >= prev ? " fresh" : "";
    return `<div class="piece ${open ? "open" : "closed"}${fresh}${i === 3 ? " full" : ""}"><div class="n">${i + 1}. ${esc(l)}</div><div class="v">${open ? esc(pieces[i]) : "Закрыто"}</div></div>`;
  }).join("")}</div>`;
}

function roundHtml(c) {
  const i = c.round, m = c.m, o = c.o;
  const mp = m.picks && m.picks[i];
  const opts = (o.options && o.options[i]) || [];
  const nextPiece = Math.min(NL, (o.pieces || []).length);
  const lot = nextPiece < NL
    ? `<div class="lot"><span>На кону: <b>${esc(LAYERS[nextPiece].toLowerCase())}</b> из секрета «${esc(o.label || "секрет")}»</span><span class="x">x${mult(i)}</span></div>`
    : `<div class="lot"><span>Секрет «${esc(o.label || "секрет")}» уже открыт. Играем на фишки</span><span class="x">x${mult(i)}</span></div>`;
  let h = `<div class="table enter">
    ${lot}
    <div class="q">${esc(qText(i, o))}</div>
    <p class="sub">${isFinal(i) ? "Финал. Ставка до 10, выигрыш тройной." : `Как ${gf(o, "ответил", "ответила")} ${esc(o.name)}? Одно из трёх правда.`}</p>`;
  if (mp) {
    const myOpts = (m.options && m.options[i]) || [];
    h += `<div class="options">${opts.map((t, k) => `<div class="opt" aria-checked="${mp.idx === k}" role="presentation"><span class="k">${LETTERS[k]}</span><span class="t">${esc(t)}</span></div>`).join("")}</div>
      <p class="note">${mp.pass ? `Ты ${gf(m, "спасовал", "спасовала")} в этом раунде.` : `Твоя ставка: ${mp.bet} на вариант ${LETTERS[mp.idx]}. Ход закрыт.`}</p>
      <div class="status" role="status"><span class="pulse" aria-hidden="true"></span>${o.picks && o.picks[i] ? `Ждём вскрытия: ${esc(o.name)} откроет свои карты, когда зайдёт…` : `Ждём ставку: ${esc(o.name)}…`}</div></div>`;
    return h;
  }
  const pick = view.pick[i], max = maxBet(i, c.mc);
  const bet = Math.min(max, view.bet[i] || Math.min(isFinal(i) ? 4 : 2, max));
  h += `<div class="options" role="radiogroup" aria-label="Варианты ответа">${opts.map((t, k) => `<button type="button" class="opt" role="radio" id="ctl-opt${k}" aria-checked="${pick === k}" data-act="pick" data-i="${i}" data-k2="${k}"><span class="k">${LETTERS[k]}</span><span class="t">${esc(t)}</span></button>`).join("")}</div>
    <div class="stake">
      <div class="lbl"><span id="stake-l">Ставка</span><span>максимум ${max}</span></div>
      <div class="stepper" role="group" aria-labelledby="stake-l">
        <button type="button" id="ctl-minus" data-act="bet" data-i="${i}" data-d="-1" aria-label="Уменьшить ставку" ${bet <= 1 ? "disabled" : ""}>-</button>
        <output aria-live="polite" class="${view.bumped ? "bump" : ""}">${bet}</output>
        <button type="button" id="ctl-plus" data-act="bet" data-i="${i}" data-d="1" aria-label="Увеличить ставку" ${bet >= max ? "disabled" : ""}>+</button>
      </div>
      <div class="quick">
        <button type="button" class="chipbtn" id="ctl-q1" data-act="betset" data-i="${i}" data-v="1" aria-pressed="${bet === 1}">Осторожно</button>
        <button type="button" class="chipbtn" id="ctl-q2" data-act="betset" data-i="${i}" data-v="${Math.ceil(max / 2)}" aria-pressed="${bet === Math.ceil(max / 2) && max > 2}">Половина</button>
        <button type="button" class="chipbtn" id="ctl-q3" data-act="betset" data-i="${i}" data-v="${max}" aria-pressed="${bet === max && max > 1}">Ва-банк</button>
      </div>
      <p class="payout">Угадаешь: <b>+${mult(i) * bet}</b>${nextPiece < NL ? " и кусочек секрета" : ""}. Ошибёшься: <b>-${bet}</b>, их заберёт ${esc(o.name)}.</p>
    </div>
    ${formErr ? `<p class="err" role="alert">${esc(formErr)}</p>` : ""}
    <div class="${c.myPassUsed ? "" : "row"}">
      ${c.myPassUsed ? "" : `<button class="btn ghost" type="button" data-act="pass" data-i="${i}" ${view.busy ? "disabled" : ""}>Пас</button>`}
      <button class="btn hot" type="button" data-act="lock" data-i="${i}" ${view.busy ? "disabled" : ""}>${view.busy === "lock" ? "Ставлю…" : pick == null ? "Выбери карту" : `Иду на ${bet}. Карта ${LETTERS[pick]}`}</button>
    </div>
    ${c.myPassUsed ? "" : `<p class="note">Пас можно взять один раз за игру.</p>`}
  </div>`;
  return h;
}

function revealHtml(c, r) {
  const m = c.m, o = c.o, i = r.i;
  if (view.reveal !== i) {
    return `<div class="table enter"><div class="sealed">
      <div class="q">${esc(qText(i, o))}</div>
      <p class="sub">Оба хода сделаны. Карты рубашкой вверх. Сердце стучит.</p>
      <div class="big" aria-hidden="true">?!</div>
      </div><button class="btn hot" type="button" id="ctl-open" data-act="open" data-i="${i}">Вскрыть раунд ${i + 1}</button></div>`;
  }
  const oOpts = (o.options && o.options[i]) || [], mOpts = (m.options && m.options[i]) || [];
  const list = (opts, truth, pickIdx, pickerName) => opts.map((t, k) => {
    const marks = [k === truth ? "правда" : "", pickIdx === k ? pickerName : ""].filter(Boolean).join(", ");
    return `<div class="card-r flip ${k === truth ? "truth" : ""}"><span class="t"><span style="font-family:var(--mono);color:var(--faint)">${LETTERS[k]}</span>&nbsp; ${esc(t)}</span><span class="m">${esc(marks)}</span></div>`;
  }).join("");
  const myLine = r.mp.pass ? `Ты ${gf(m, "спасовал", "спасовала")}.` : r.mp.idx === r.ot ? `Ты ${gf(m, "угадал", "угадала")}.` : `Ты ${gf(m, "ошибся", "ошиблась")}.`;
  const opLine = r.op.pass ? `${esc(o.name)} ${gf(o, "спасовал", "спасовала")}.` : r.op.idx === r.mt ? `${esc(o.name)} ${gf(o, "угадал", "угадала")}.` : `${esc(o.name)} ${gf(o, "купился", "купилась")} на твою ложь.`;
  const cls = n => n > 0 ? "ok" : n < 0 ? "no" : "zero";
  const last = c.rounds.filter(x => x.done).length === ROUNDS && c.rounds.every(x => x.i === i || view.opened.includes(x.i));
  return `<div class="table enter">
    <div class="q">${esc(qText(i, o))}</div>
    <div class="res-h">${gf(o, "Его", "Её")} карты. ${myLine}</div>
    ${list(oOpts, r.ot, r.mp.pass ? -1 : r.mp.idx, "твой выбор")}
    <div class="res-h">Твои карты. ${opLine}</div>
    ${list(mOpts, r.mt, r.op.pass ? -1 : r.op.idx, gf(o, "его выбор", "её выбор"))}
    <div class="res-h">Итог раунда</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <span class="delta ${cls(r.md)}">Ты ${sign(r.md)}</span>
      <span class="delta ${cls(r.od)}">${esc(o.name)} ${sign(r.od)}</span>
    </div>
    <button class="btn" type="button" id="ctl-next" data-act="seen" data-i="${i}">${last ? "К финалу" : "Следующий раунд"}</button>
  </div>`;
}

function finishedHtml(c) {
  const o = c.o;
  const v = c.mc > c.oc ? "Ты выигрываешь стол" : c.mc < c.oc ? `Стол за ${esc(o.name)}` : "Ничья";
  const n = c.mc > c.oc ? `${esc(o.name)} открывает свой секрет целиком.` : c.mc < c.oc ? "Твой секрет открывается целиком." : "Открываются оба секрета.";
  return `<div class="table enter"><div class="round-tag">Счёт ${c.mc} : ${c.oc}</div><div class="verdict">${v}</div><p class="hint">${n}</p></div>`;
}

document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset && el.dataset.k) drafts[el.dataset.k] = el.value;
});

function fail(msg, k) { formErr = msg; errField = k || ""; lastSig = ""; tick(); }

document.addEventListener("submit", async e => {
  e.preventDefault();
  if (!db || view.busy || e.target.id !== "setup") return;
  formErr = "";
  const v = k => (drafts[k] || "").trim();
  const name = v("name"), label = v("label");
  if (!name) return fail("Напиши имя, под которым сядешь за стол.", "name");
  if (!drafts.g) return fail("Выбери, как к тебе обращаться: он или она.", "");
  const options = {}, truthIdx = [];
  for (let i = 0; i < ROUNDS; i++) {
    const t = v("t" + i), a = v(`d${i}a`), b = v(`d${i}b`);
    if (!t) return fail(`Раунд ${i + 1}: напиши правду.`, "t" + i);
    if (!a) return fail(`Раунд ${i + 1}: нужен ложный ответ.`, `d${i}a`);
    if (!b) return fail(`Раунд ${i + 1}: нужен второй ложный ответ.`, `d${i}b`);
    const low = [t, a, b].map(x => x.toLowerCase());
    if (new Set(low).size < 3) return fail(`Раунд ${i + 1}: все три ответа должны различаться.`, `d${i}a`);
    const arr = [t, a, b];
    for (let k = arr.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [arr[k], arr[j]] = [arr[j], arr[k]]; }
    options[i] = arr; truthIdx.push(arr.indexOf(t));
  }
  const layers = LAYERS.map((_, i) => v("l" + i));
  const el = layers.findIndex(l => !l);
  if (el >= 0) return fail(`Заполни кусочек ${el + 1} своего секрета.`, "l" + el);
  try {
    view.busy = "join"; tick();
    saveVault({ truthIdx, layers });
    vault = { truthIdx, layers };
    await seatRef().set({ name, g: drafts.g, label: label || "секрет", joinedAt: Date.now(), options, picks: {}, truth: {}, pieces: [], surrendered: false });
  } catch (x) { formErr = saveErr(x); }
  view.busy = ""; tick();
});

document.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]");
  if (!b || view.busy) return;
  if (!db && b.dataset.act !== "copy") return;
  const act = b.dataset.act, i = b.dataset.i;
  view.bumped = act === "bet" || act === "betset";
  formErr = "";
  const c = docs[me] && opp() ? calc() : null;
  try {
    if (act === "copy") { try { await navigator.clipboard.writeText(inviteLink()); b.textContent = "Скопировано"; } catch (e2) { b.textContent = "Скопируй ссылку вручную"; } return; }
    else if (act === "gender") { drafts.g = b.dataset.v; lastSig = ""; }
    else if (act === "pick") { view.pick[i] = +b.dataset.k2; }
    else if (act === "bet" || act === "betset") {
      const max = maxBet(+i, c.mc), cur = view.bet[i] || Math.min(isFinal(+i) ? 4 : 2, max);
      view.bet[i] = Math.min(max, Math.max(1, act === "bet" ? cur + +b.dataset.d : +b.dataset.v));
    }
    else if (act === "lock") {
      if (view.pick[i] == null) { formErr = "Сначала выбери один из трёх вариантов."; }
      else {
        const max = maxBet(+i, c.mc), bet = Math.min(max, view.bet[i] || Math.min(isFinal(+i) ? 4 : 2, max));
        view.busy = "lock"; tick();
        await seatRef().update({ picks: { [i]: { idx: view.pick[i], bet } } });
      }
    }
    else if (act === "pass") { view.busy = "pass"; tick(); await seatRef().update({ picks: { [i]: { pass: true, bet: 0, idx: -1 } } }); }
    else if (act === "open") { view.reveal = +i; }
    else if (act === "seen") { view.opened = [...view.opened, +i]; view.reveal = null; saveOpened(); window.scrollTo({ top: 0, behavior: "smooth" }); }
    else if (act === "askSurrender") view.confirmSurrender = true;
    else if (act === "noSurrender") view.confirmSurrender = false;
    else if (act === "surrender") { view.confirmSurrender = false; view.busy = "surrender"; tick(); await seatRef().update({ surrendered: true }); }
  } catch (x) { formErr = saveErr(x); }
  view.busy = ""; tick();
});

function saveErr(x) {
  if (x && x.code === "full") return "За этим столом уже сидят двое. Попроси новую ссылку.";
  return (x && x.code === "invalid_argument")
    ? "Ход не сохранился. Обнови страницу и попробуй ещё раз."
    : "Ход не сохранился. Проверь интернет и нажми ещё раз.";
}

(async () => {
  if (!GID) { renderLanding(); return; }
  render();
  if (!SUPABASE_ANON_KEY) { err = "Сайт ещё не подключён к базе данных."; return tick(); }
  const timer = setTimeout(() => { if (!loaded) { err = "Не получается подключиться. Проверь интернет и обнови страницу."; tick(); } }, 12000);
  let supa;
  try {
    const createClient = await loadSupabase();
    supa = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, storageKey: "ssz-auth" } });
    let { data: { session } } = await supa.auth.getSession();
    if (!session) { const r = await supa.auth.signInAnonymously(); if (r.error) throw r.error; session = r.data.session; }
    me = session.user.id;
  } catch (e) { console.error(e); clearTimeout(timer); err = "Не получилось подключиться к игре. Обнови страницу."; return tick(); }

  const fetchAll = async () => {
    const { data, error } = await supa.from("ssz_players").select("uid,data").eq("game_id", GID);
    if (error) throw error;
    const next = {};
    data.forEach(r => { next[r.uid] = r.data; });
    docs = next; loaded = true; clearTimeout(timer);
    if (err.startsWith("Не получается")) err = "";
    tick();
  };
  const seat = {
    set: async d => {
      const { error } = await supa.from("ssz_players").insert({ game_id: GID, uid: me, data: d });
      if (error) throw (error.code === "42501" ? { code: "full" } : error);
      await fetchAll();
    },
    update: async d => {
      const merged = merge(JSON.parse(JSON.stringify(docs[me] || {})), d);
      const { error } = await supa.from("ssz_players").update({ data: merged, updated_at: new Date().toISOString() }).eq("game_id", GID).eq("uid", me);
      if (error) throw error;
      docs = { ...docs, [me]: merged };
      tick();
    }
  };
  db = seat; seatRef = () => seat;
  vault = loadVault(); vaultLoaded = true;
  try { await fetchAll(); } catch (e) { console.error(e); err = "Не получилось загрузить игру. Обнови страницу."; return tick(); }
  supa.channel("ssz-" + GID)
    .on("postgres_changes", { event: "*", schema: "public", table: "ssz_players", filter: "game_id=eq." + GID }, () => fetchAll().catch(console.error))
    .subscribe();
  setInterval(() => { if (document.visibilityState === "visible") fetchAll().catch(() => {}); }, 15000);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") fetchAll().catch(() => {}); });
})();
</script>
</body>
</html>
